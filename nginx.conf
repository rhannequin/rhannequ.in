server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /up {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    location = /styles.css {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css image/svg+xml application/xml;
}